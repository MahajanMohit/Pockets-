name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Reusable steps are inlined per job (GitHub Actions has no native step reuse)
# gradle-wrapper.jar is not in the repo, so we install Gradle 8.10.2 directly
# via gradle/actions/setup-gradle and run 'gradle wrapper' to generate it.

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Debug APK — runs on every push / PR
  # ────────────────────────────────────────────────────────────────────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # Install Android SDK CLI tools so sdkmanager is on PATH
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35 + build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # Install Gradle 8.10.2 directly (avoids needing gradle-wrapper.jar in repo)
      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Generate gradle-wrapper.jar so ./gradlew works
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenDeck-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Release APK — main / master / workflow_dispatch only
  # ────────────────────────────────────────────────────────────────────────────
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      github.event_name == 'workflow_dispatch'

    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35 + build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Unsigned release (always)
      - name: Build unsigned release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenDeck-release-unsigned-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 90

      # Signed release — only when KEYSTORE_BASE64 secret is configured
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > zendeck-release.jks

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/zendeck-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload signed release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ZenDeck-release-signed-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 90
